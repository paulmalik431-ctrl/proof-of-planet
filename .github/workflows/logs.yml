name: Read function logs
on:
  workflow_dispatch:
    inputs:
      match: { description: "text to match in log lines", default: "failed", required: false }
      hours: { description: "look back this many hours", default: "2", required: false }
permissions: { contents: read }
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Query edge function logs (phone numbers redacted)
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MATCH: ${{ inputs.match }}
          HOURS: ${{ inputs.hours }}
        run: |
          START=$(date -u -d "-${HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          SQL="SELECT timestamp, source_name, event_message FROM logs WHERE positionCaseInsensitive(event_message, '${MATCH}') > 0 ORDER BY timestamp DESC LIMIT 40"
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $TOKEN" --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" \
            | sed -E 's/[0-9]{9,}/[redacted]/g; s/EAA[A-Za-z0-9]+/[token]/g' | python3 -c "import sys,json; d=json.load(sys.stdin); [print(r.get('timestamp'), r.get('source_name'), str(r.get('event_message'))[:600]) for r in d.get('result',[])] or print(json.dumps(d)[:800])"
