name: Publish daily ledger fingerprint

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/anchor.ts
      - name: Commit new fingerprint
        run: |
          git add anchors/ledger-heads.jsonl
          if git diff --cached --quiet; then
            echo "No new ledger head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish ledger fingerprint"
          git push

