name: Deploy backend (Supabase)
# Runs when the backend changes on main, or by hand (Actions → Deploy backend → Run workflow).
# Needs three repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: |
          for f in whatsapp simulate atlas intake; do
            supabase functions deploy $f --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          done
