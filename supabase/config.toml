project_id = "proof-of-planet"

[functions.whatsapp]
verify_jwt = false   # Meta calls this webhook; requests are checked with X-Hub-Signature-256

[functions.simulate]
verify_jwt = false   # public demo; protected by per-session and daily caps

[functions.atlas]
verify_jwt = false   # public read; the brief is cached for 6 hours to bound cost

[functions.intake]
verify_jwt = false   # the buyer proves they're the buyer with the one-time intake code

[functions.card]
verify_jwt = false   # public read; one Muse Image card per verified outcome, daily cap CARD_DAILY_CAP

[functions.wa-setup]
verify_jwt = false   # idempotent: only (re)subscribes our own app to our own WhatsApp account; returns status, never secrets
