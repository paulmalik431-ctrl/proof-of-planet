<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence File — ECO · Proof of Planet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap" style="padding-top:32px;padding-bottom:48px" id="main">
  <p class="muted">Loading evidence…</p>
</main>
<script type="module">
import { nav, rest, configured, el, photoUrl, fmtDate, short, notConfigured, PROTOCOL_TITLES, OUTCOME_WORDS } from "./app.js";
document.getElementById("nav").replaceWith(nav());
const main = document.getElementById("main");
const id = new URLSearchParams(location.search).get("id") ?? "";

function photoWithBoxes(path, boxes, caption) {
  const wrap = el("div", { class: "photo" }, el("img", { src: photoUrl(path), alt: caption, loading: "lazy" }));
  for (const b of boxes ?? []) {
    if (!b.w || !b.h) continue;
    wrap.append(el("div", { class: "box", style: `left:${(b.x1 / b.w) * 100}%;top:${(b.y1 / b.h) * 100}%;width:${((b.x2 - b.x1) / b.w) * 100}%;height:${((b.y2 - b.y1) / b.h) * 100}%` },
      el("span", {}, `${b.label}${b.c !== null && b.c !== undefined ? ` ${Math.round(b.c * 100)}%` : ""}`)));
  }
  return el("figure", { style: "margin:0" }, wrap, el("figcaption", { class: "small muted", style: "margin-top:6px" }, caption));
}

async function load() {
  if (!configured) { main.innerHTML = ""; return notConfigured(main); }
  if (!/^[0-9a-f-]{36}$/i.test(id)) { main.innerHTML = "<p>No Evidence File id in the link.</p>"; return; }
  const [claims, photos, checks, ledger] = await Promise.all([
    rest(`public_claims?id=eq.${id}&select=*`),
    rest(`public_evidence?claim_id=eq.${id}&select=*&order=created_at`),
    rest(`public_checks?claim_id=eq.${id}&select=*&order=created_at.desc`),
    rest(`public_ledger?ref=eq.${id}&select=*`),
  ]);
  const c = claims[0];
  if (!c) { main.innerHTML = "<p>This Evidence File doesn't exist, or the claim hasn't been checked yet.</p>"; return; }
  const k = checks[0];
  let parentPhotos = [];
  if (c.parent_id) parentPhotos = await rest(`public_evidence?claim_id=eq.${c.parent_id}&select=*`);
  const outcome = k?.decision?.outcome ?? c.status;
  main.innerHTML = "";

  main.append(
    el("p", { class: "label" }, `Witness · Evidence File · ${c.id.slice(0, 8)}`),
    el("div", { style: "display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px" },
      el("h1", { style: "margin:0;font-size:clamp(34px,6vw,56px)" }, PROTOCOL_TITLES[c.protocol] ?? c.protocol),
      el("span", { class: `stamp ${outcome}` }, OUTCOME_WORDS[outcome] ?? outcome)),
    el("p", { class: "muted" }, `By `, el("a", { href: `ledger.html?account=${c.account_id}` }, c.account_id), ` · reported ${fmtDate(c.created_at)}`,
      c.lat !== null ? [" · ", el("a", { href: `https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lng}#map=17/${c.lat}/${c.lng}` }, `${c.lat}, ${c.lng}`)] : ""),
  );

  const gallery = el("div", { class: "grid g2", style: "margin:24px 0" });
  for (const p of parentPhotos) gallery.append(photoWithBoxes(p.path, [], "Original planting photo (earlier claim)"));
  for (const p of photos) gallery.append(photoWithBoxes(p.path, k?.boxes?.[p.role], `${p.role} · SAM 3.1 found ${k?.counts?.[p.role] ?? 0} · sha256 ${short(p.sha256)}`));
  main.append(gallery);
  const claimSteps = [
    { at: c.created_at, title: "Claim opened", detail: "Witness started this evidence record." },
    ...photos.map((photo) => ({ at: photo.created_at, title: "Evidence received: " + (photo.role ?? "photo"), detail: "SHA-256 " + short(photo.sha256) })),
  ];
  if (k) claimSteps.push({ at: k.created_at, title: "Evidence checked", detail: (k.models?.calls ?? 0) + " model calls · " + ((k.models?.ms ?? 0) / 1000).toFixed(1) + " s · " + (OUTCOME_WORDS[k.decision.outcome] ?? k.decision.outcome) });
  for (const entry of ledger) if (entry.amount > 0) claimSteps.push({ at: entry.at, title: "Reward posted", detail: "+" + entry.amount + " ECOIN · ledger #" + entry.seq });
  claimSteps.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  main.append(el("div", { class: "card", style: "margin-bottom:16px" },
    el("p", { class: "label" }, "Receipt step trace"),
    el("ol", { class: "timeline" }, claimSteps.map((step) => el("li", {},
      el("b", {}, step.title), el("div", { class: "small muted" }, fmtDate(step.at) + " · " + step.detail))))));


  if (k) {
    const o = k.observation;
    const answers = Object.entries(o.answers ?? {}).map(([q, a]) => el("tr", {}, el("td", {}, q.replaceAll("_", " ")), el("td", {}, el("span", { class: `tag ${a}` }, a))));
    main.append(el("div", { class: "grid g2" },
      el("div", { class: "card" },
        el("p", { class: "label" }, "Decision"),
        el("ul", { class: "reasons" }, (k.decision.reasons ?? []).map((r) => el("li", {}, r))),
        el("p", { style: "margin-top:12px" }, ledger[0]
          ? [el("b", {}, `+${ledger[0].amount} ECOIN`), " · ledger entry ", el("a", { href: `ledger.html#seq-${ledger[0].seq}` }, `#${ledger[0].seq}`)]
          : el("span", { class: "muted" }, "No ECOIN paid for this claim.")),
        o.better_evidence ? el("p", { class: "small muted" }, `What would settle it: ${o.better_evidence}`) : null),
      el("div", { class: "card" },
        el("p", { class: "label" }, "What Muse Spark saw"),
        el("p", {}, o.notes || "—"),
        el("table", { class: "kv" }, answers,
          el("tr", {}, el("td", {}, "possibly AI-generated or edited"), el("td", {}, el("span", { class: `tag ${o.possibly_ai_generated_or_edited ? "no" : "yes"}` }, o.possibly_ai_generated_or_edited ? "flagged" : "no signs"))),
          el("tr", {}, el("td", {}, "model confidence"), el("td", {}, `${Math.round((o.confidence ?? 0) * 100)}%`)))),
    ));
    main.append(el("p", { class: "small muted", style: "margin-top:16px" },
      `Checked ${fmtDate(k.created_at)} by ${k.models.segmentation} and ${k.models.reasoning} · ${k.models.calls} model calls · ${(k.models.ms / 1000).toFixed(1)} s. Meta's models observe; fixed rules decide; only a verified decision pays.`));
    const trace = k.models.trace ?? [];
    if (trace.length) main.append(el("div", { class: "card", style: "margin-top:12px" },
      el("p", { class: "label" }, "Model call trace"),
      el("ol", { class: "timeline" }, trace.map((call) => el("li", {},
        el("b", {}, call.model), el("div", { class: "small muted" }, `${call.endpoint} · ${call.ms} ms · ${call.ok ? "completed" : "failed"}`))))));
  }
}
load().catch((e) => { main.innerHTML = ""; main.append(el("p", {}, "Could not load this Evidence File."), el("p", { class: "small muted" }, String(e.message ?? e))); });
</script>
</body>
</html>
